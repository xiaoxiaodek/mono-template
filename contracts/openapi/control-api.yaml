components:
  parameters:
    RequestID:
      description: Optional request correlation ID
      in: header
      name: X-Request-ID
      schema:
        type: string
  responses:
    ConflictError:
      content:
        application/json:
          example:
            code: CONFLICT
            message: resource conflict
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - CONFLICT
                type: string
              message:
                enum:
                  - resource conflict
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Resource conflict
    DependencyError:
      content:
        application/json:
          example:
            code: DEPENDENCY_ERROR
            message: required dependency unavailable
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - DEPENDENCY_ERROR
                type: string
              message:
                enum:
                  - required dependency unavailable
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Required dependency unavailable
    ForbiddenError:
      content:
        application/json:
          example:
            code: FORBIDDEN
            message: forbidden
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - FORBIDDEN
                type: string
              message:
                enum:
                  - forbidden
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Access forbidden
    InternalError:
      content:
        application/json:
          example:
            code: INTERNAL_ERROR
            message: internal server error
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - INTERNAL_ERROR
                type: string
              message:
                enum:
                  - internal server error
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Internal server error
    NotFoundError:
      content:
        application/json:
          example:
            code: NOT_FOUND
            message: resource not found
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - NOT_FOUND
                type: string
              message:
                enum:
                  - resource not found
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Resource not found
    RateLimitedError:
      content:
        application/json:
          example:
            code: RATE_LIMITED
            message: rate limit exceeded
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - RATE_LIMITED
                type: string
              message:
                enum:
                  - rate limit exceeded
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Rate limit exceeded
    TimeoutError:
      content:
        application/json:
          example:
            code: DEPENDENCY_ERROR
            message: request timed out
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - DEPENDENCY_ERROR
                type: string
              message:
                enum:
                  - request timed out
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Request timed out
    UnauthorizedError:
      content:
        application/json:
          example:
            code: UNAUTHORIZED
            message: authentication required
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - UNAUTHORIZED
                type: string
              message:
                enum:
                  - authentication required
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Authentication required
    ValidationError:
      content:
        application/json:
          example:
            code: VALIDATION_ERROR
            message: invalid request
            request_id: req_01HXYZ
          schema:
            additionalProperties: false
            properties:
              code:
                enum:
                  - VALIDATION_ERROR
                type: string
              message:
                enum:
                  - invalid request
                type: string
              request_id:
                type: string
            required:
              - code
              - message
              - request_id
            type: object
      description: Invalid request
  schemas:
    AuthData:
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        user:
          $ref: '#/components/schemas/User'
      required:
        - access_token
        - refresh_token
        - user
      type: object
    ErrorCode:
      enum:
        - VALIDATION_ERROR
        - UNAUTHORIZED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - DEPENDENCY_ERROR
        - INTERNAL_ERROR
      type: string
    ErrorEnvelope:
      additionalProperties: false
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        request_id:
          type: string
      required:
        - code
        - message
        - request_id
      type: object
    HealthData:
      properties:
        status:
          type: string
      required:
        - status
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
      required:
        - email
        - password
      type: object
    ReadinessData:
      properties:
        checks:
          additionalProperties:
            type: string
          type: object
        status:
          type: string
      required:
        - checks
        - status
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token
      type: object
    RegisterRequest:
      additionalProperties: false
      properties:
        email:
          format: email
          type: string
        password:
          maxLength: 128
          minLength: 8
          type: string
      required:
        - email
        - password
      type: object
    ResponseEnvelope:
      additionalProperties: false
      properties:
        code:
          enum:
            - OK
          type: string
        data:
          type: object
        message:
          type: string
        request_id:
          type: string
      required:
        - code
        - message
        - data
        - request_id
      type: object
    TokenPair:
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
      required:
        - access_token
        - refresh_token
      type: object
    User:
      properties:
        created_at:
          format: date-time
          type: string
        email:
          type: string
        id:
          type: string
        roles:
          items:
            type: string
          type: array
        updated_at:
          format: date-time
          type: string
      required:
        - created_at
        - email
        - id
        - roles
        - updated_at
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: Contract for the Vort Ads control-plane health and identity APIs.
  title: Vort Ads Control API
  version: 0.1.0
openapi: 3.0.3
paths:
  /api/v1/auth/login:
    post:
      operationId: login
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    enum:
                      - OK
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthData'
                  message:
                    enum:
                      - ok
                    type: string
                  request_id:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - request_id
                type: object
          description: Credentials accepted and token pair issued.
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "429":
          $ref: '#/components/responses/RateLimitedError'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyError'
        "504":
          $ref: '#/components/responses/TimeoutError'
      security: []
      summary: Authenticate a user
      tags:
        - Authentication
  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    enum:
                      - OK
                    type: string
                  data:
                    $ref: '#/components/schemas/TokenPair'
                  message:
                    enum:
                      - ok
                    type: string
                  request_id:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - request_id
                type: object
          description: A replacement token pair was issued.
        "400":
          $ref: '#/components/responses/ValidationError'
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "429":
          $ref: '#/components/responses/RateLimitedError'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyError'
        "504":
          $ref: '#/components/responses/TimeoutError'
      security: []
      summary: Rotate a refresh token
      tags:
        - Authentication
  /api/v1/auth/register:
    post:
      operationId: register
      parameters:
        - $ref: '#/components/parameters/RequestID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    enum:
                      - OK
                    type: string
                  data:
                    $ref: '#/components/schemas/AuthData'
                  message:
                    enum:
                      - ok
                    type: string
                  request_id:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - request_id
                type: object
          description: User registered and token pair issued.
        "400":
          $ref: '#/components/responses/ValidationError'
        "409":
          $ref: '#/components/responses/ConflictError'
        "429":
          $ref: '#/components/responses/RateLimitedError'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyError'
        "504":
          $ref: '#/components/responses/TimeoutError'
      security: []
      summary: Register a user
      tags:
        - Authentication
  /api/v1/me:
    get:
      operationId: getCurrentUser
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    enum:
                      - OK
                    type: string
                  data:
                    $ref: '#/components/schemas/User'
                  message:
                    enum:
                      - ok
                    type: string
                  request_id:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - request_id
                type: object
          description: The authenticated user's profile.
        "401":
          $ref: '#/components/responses/UnauthorizedError'
        "429":
          $ref: '#/components/responses/RateLimitedError'
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyError'
        "504":
          $ref: '#/components/responses/TimeoutError'
      security:
        - bearerAuth: []
      summary: Get the authenticated user
      tags:
        - Users
  /healthz:
    get:
      operationId: getHealth
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    enum:
                      - OK
                    type: string
                  data:
                    $ref: '#/components/schemas/HealthData'
                  message:
                    enum:
                      - ok
                    type: string
                  request_id:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - request_id
                type: object
          description: The process is alive.
        "500":
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Check process liveness
      tags:
        - Health
  /readyz:
    get:
      operationId: getReadiness
      parameters:
        - $ref: '#/components/parameters/RequestID'
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: false
                properties:
                  code:
                    enum:
                      - OK
                    type: string
                  data:
                    $ref: '#/components/schemas/ReadinessData'
                  message:
                    enum:
                      - ok
                    type: string
                  request_id:
                    type: string
                required:
                  - code
                  - message
                  - data
                  - request_id
                type: object
          description: The service and its required dependencies are ready.
        "500":
          $ref: '#/components/responses/InternalError'
        "503":
          $ref: '#/components/responses/DependencyError'
      security: []
      summary: Check dependency readiness
      tags:
        - Health
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Authentication
  - name: Users
