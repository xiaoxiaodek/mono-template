apiVersion: v1
kind: ConfigMap
metadata:
  name: operation-api-config
  labels:
    app.kubernetes.io/name: operation-api
    app.kubernetes.io/part-of: vort-ads
data:
  prod.yaml: |
    app:
      name: vort-ads-operation-api
      env: prod
    http:
      addr: ":8080"
      read_timeout: 5s
      write_timeout: 10s
      idle_timeout: 60s
      shutdown_timeout: 15s
      max_body_bytes: 1048576
    security:
      access_token_ttl: 15m
      refresh_token_ttl: 168h
      trusted_proxies: []
    cors:
      allowed_origins: ["https://admin.example.com"]
      allowed_methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
      allowed_headers: ["Authorization", "Content-Type", "X-Request-ID"]
      allow_credentials: true
      max_age: 1h
    database:
      dsn_env: "DATABASE_URL"
      max_open_conns: 50
      max_idle_conns: 10
      conn_max_lifetime: 30m
    redis:
      addr: "redis:6379"
      required: true
    observability:
      pprof_enabled: false
      swagger_enabled: false
      tracing:
        enabled: false
        endpoint: ""
        sampling_ratio: 1.0
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operation-api
  labels:
    app.kubernetes.io/name: operation-api
    app.kubernetes.io/part-of: vort-ads
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: operation-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: operation-api
        app.kubernetes.io/part-of: vort-ads
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operation-api
          # Replace with an immutable digest in each environment.
          image: ghcr.io/vort-ads/operation-api:0.1.0
          imagePullPolicy: IfNotPresent
          # The externally managed operation-api-secrets Secret must contain
          # DATABASE_URL, REDIS_PASSWORD, and JWT_SECRET.
          env:
            - name: APP_ENV
              value: prod
            - name: CONFIG_DIR
              value: /app/configs
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: operation-api-secrets
                  key: DATABASE_URL
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: operation-api-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: operation-api-secrets
                  key: JWT_SECRET
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /app/configs
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
      volumes:
        - name: config
          configMap:
            name: operation-api-config
---
apiVersion: v1
kind: Service
metadata:
  name: operation-api
  labels:
    app.kubernetes.io/name: operation-api
    app.kubernetes.io/part-of: vort-ads
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: operation-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
