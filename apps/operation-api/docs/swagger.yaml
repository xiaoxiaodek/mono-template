basePath: /api/v1
definitions:
  apps_operation-api_internal_service_identity.AuthData:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/apps_operation-api_internal_service_identity.User'
    type: object
  apps_operation-api_internal_service_identity.LoginRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  apps_operation-api_internal_service_identity.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  apps_operation-api_internal_service_identity.RegisterRequest:
    properties:
      email:
        type: string
      password:
        maxLength: 128
        minLength: 8
        type: string
    required:
    - email
    - password
    type: object
  apps_operation-api_internal_service_identity.TokenPair:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  apps_operation-api_internal_service_identity.User:
    properties:
      created_at:
        type: string
      email:
        type: string
      id:
        type: string
      roles:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope:
    properties:
      code:
        type: string
      data: {}
      message:
        type: string
      request_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    name: Vort Ads Team
  description: Identity and control-plane API for the Vort Ads platform.
  license:
    name: Proprietary
  title: Vort Ads Operation API
  version: 0.1.0
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Verify credentials and return an access/refresh token pair.
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apps_operation-api_internal_service_identity.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_operation-api_internal_service_identity.AuthData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
      summary: Authenticate a user
      tags:
      - Authentication
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Consume a refresh token and issue a new token pair.
      parameters:
      - description: Refresh payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apps_operation-api_internal_service_identity.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_operation-api_internal_service_identity.TokenPair'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
      summary: Rotate a refresh token
      tags:
      - Authentication
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new account and return an access/refresh token pair.
      parameters:
      - description: Registration payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apps_operation-api_internal_service_identity.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_operation-api_internal_service_identity.AuthData'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
      summary: Register a user
      tags:
      - Authentication
  /me:
    get:
      consumes:
      - application/json
      description: Return the profile of the user identified by the bearer token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
            - properties:
                data:
                  $ref: '#/definitions/apps_operation-api_internal_service_identity.User'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/github_com_vort-ads_vort-ads-template_internal_platform_response.Envelope'
      security:
      - BearerAuth: []
      summary: Get the authenticated user
      tags:
      - Users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and the JWT access token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
